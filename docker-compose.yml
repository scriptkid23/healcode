version: '3.8'

services:
  # Redis service
  redis:
    image: redis:7
    container_name: claris-redis
    ports:
      - "6379:6379"

  indexer:
    build:
      context: .
      dockerfile: docker/python.Dockerfile

  search-proxy:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: search-proxy --port 8000 --zoekt-url http://zoekt:6070
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ai-engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    volumes:
      - ./example_repo:/repo
    depends_on:
      search-proxy:
        condition: service_healthy
      redis:
        condition: service_started
    # quan trọng: chỉnh search-url + redis-url cho đúng
    command: >
      ai-engine 
      --repo-path /repo 
      --search-url http://search-proxy:8000 
      --redis-url redis://redis:6379
    restart: "no"

  pr-creator:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    volumes:
      - ./example_repo:/repo
    depends_on:
      - ai-engine
    command: >
      pr-creator 
      --repo-path /repo 
      --branch-name ai-refactoring/none-comparison-fix 
      --commit-message "Refactor: Replace == None with is None"
    restart: "no"
